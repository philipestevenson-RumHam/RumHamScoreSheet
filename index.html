<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>RumHam Score Sheet</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700;800&display=swap');
  :root {
    --bg: #0f0f13;
    --surface: #1a1a22;
    --surface2: #22222e;
    --accent: #f0c040;
    --accent2: #e05a5a;
    --gold: #f0c040;
    --silver: #c0c0c0;
    --bronze: #cd7f32;
    --text: #f0ede8;
    --text-muted: #888899;
    --green: #50b478;
    --radius: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }

  body {
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── SETUP SCREEN ── */
  #setup-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 32px 24px;
  }

  .setup-logo { margin-bottom: 16px; line-height: 1; }
  .setup-logo img { height: 140px; mix-blend-mode: screen; display: block; }

  .setup-title {
    font-size: 34px;
    font-weight: 800;
    
    letter-spacing: -0.5px;
    margin-bottom: 4px;
    color: var(--accent);
  }

  .setup-subtitle { color: var(--text-muted); font-size: 16px; margin-bottom: 36px; }

  .setup-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 28px;
    width: 100%;
    max-width: 560px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.06);
  }

  .setup-row { display: flex; gap: 16px; margin-bottom: 24px; }

  .setup-field { flex: 1; display: flex; flex-direction: column; gap: 8px; }

  .setup-field label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  .stepper {
    display: flex;
    align-items: center;
    background: var(--bg);
    border: 1.5px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    overflow: hidden;
  }

  .stepper button {
    background: none;
    border: none;
    color: var(--text);
    font-size: 26px;
    font-weight: 300;
    width: 52px;
    height: 54px;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s;
    display: flex; align-items: center; justify-content: center;
  }
  .stepper button:active { background: rgba(255,255,255,0.1); }

  .stepper-val {
    flex: 1;
    text-align: center;
    font-size: 24px;
    font-weight: 800;
    color: var(--accent2);
    user-select: none;
  }

  .divider { height: 1px; background: rgba(255,255,255,0.07); margin: 8px 0 24px; }

  .teams-section label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    display: block;
    margin-bottom: 14px;
  }

  #team-names-grid {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 400px;
    overflow-y: auto;
  }

  .team-name-input-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .team-name-input-wrap input {
    flex: 1;
    min-width: 0;
    background: var(--bg);
    border: 1.5px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    color: var(--text);
    font-size: 15px;
    font-weight: 500;
    padding: 10px 12px;
    outline: none;
    transition: border-color 0.2s;
  }
  .team-name-input-wrap input:focus { border-color: var(--accent2); }

  .team-num-badge {
    width: 22px;
    min-width: 22px;
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    flex-shrink: 0;
  }

  .player-count-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 1;
    min-width: 0;
  }
  .player-count-label {
    font-size: 14px;
    color: var(--text-muted);
    flex-shrink: 0;
  }
  .player-count-stepper {
    display: flex;
    align-items: center;
    background: var(--bg);
    border: 1.5px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    overflow: hidden;
    flex: 1;
    min-width: 0;
  }
  .player-count-stepper button {
    background: none;
    border: none;
    color: var(--text);
    font-size: 22px;
    font-weight: 300;
    width: 36px;
    height: 42px;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .player-count-stepper button:active { background: rgba(255,255,255,0.1); }
  .player-count-val {
    flex: 1;
    text-align: center;
    font-size: 18px;
    font-weight: 800;
    color: var(--accent2);
    user-select: none;
  }


  .btn-start {
    margin-top: 28px;
    width: 100%;
    background: var(--accent);
    border: none;
    border-radius: 12px;
    color: #000;
    font-size: 20px;
    font-weight: 800;
    
    padding: 18px;
    cursor: pointer;
    box-shadow: 0 6px 24px rgba(240,192,64,0.35);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .btn-start:active { transform: scale(0.98); }

  /* ── MAIN APP ── */
  #app-screen { display: none; flex-direction: column; height: 100vh; }

  .app-header {
    background: var(--surface);
    padding: 14px 20px 0;
    box-shadow: 0 2px 12px rgba(0,0,0,0.3);
    flex-shrink: 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .header-title {
    font-size: 22px;
    font-weight: 800;
    
    color: var(--accent);
  }

  .header-title img { height: 54px; mix-blend-mode: screen; vertical-align: middle; }
  .header-meta { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

  .btn-reset {
    background: rgba(233,69,96,0.15);
    border: 1.5px solid rgba(233,69,96,0.4);
    border-radius: 8px;
    color: var(--accent);
    font-size: 13px;
    font-weight: 700;
    padding: 8px 14px;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
  }
  .btn-reset:active { background: rgba(233,69,96,0.3); }

  /* Main tab bar */
  .tab-bar {
    display: flex;
    overflow-x: auto;
    gap: 2px;
    scrollbar-width: none;
  }
  .tab-bar::-webkit-scrollbar { display: none; }

  .tab-btn {
    flex-shrink: 0;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 14px;
    font-weight: 600;
    padding: 10px 18px;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: color 0.2s, border-color 0.2s;
    white-space: nowrap;
  }
  .tab-btn.active { color: var(--accent2); border-bottom-color: var(--accent2); }

  /* Content */
  .content-area {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  /* ── ROUND SCORE ENTRY ── */
  .round-panel { display: none; padding: 16px 20px; }
  .round-panel.active { display: block; }

  .round-max-row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    margin-bottom: 16px;
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid rgba(255,255,255,0.06);
  }
  .round-max-label {
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .round-max-input {
    text-align: center;
    font-size: 22px;
    font-weight: 800;
    color: var(--accent);
    background: var(--bg);
    border: 1.5px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    width: 64px;
    height: 40px;
    outline: none;
    -webkit-appearance: none;
  }

  /* List layout for scores */
  .score-list {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid rgba(255,255,255,0.06);
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  }

  .score-list-header {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    padding: 10px 16px;
    background: var(--surface2);
    border-bottom: 1px solid rgba(255,255,255,0.07);
  }

  .score-list-header span {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  .score-list-header .score-col-label {
    width: 160px;
    text-align: center;
  }

  .score-row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    padding: 10px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    transition: background 0.15s;
    gap: 12px;
  }
  .score-row:last-child { border-bottom: none; }
  .score-row:focus-within { background: rgba(245,166,35,0.05); }

  .score-row-name {
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .score-row-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 160px;
    justify-content: flex-end;
    flex-shrink: 0;
  }

  .score-stepper-btn {
    background: var(--bg);
    border: 1.5px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    color: var(--text);
    font-size: 20px;
    font-weight: 400;
    width: 40px;
    height: 40px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s, border-color 0.15s;
    user-select: none;
  }
  .score-stepper-btn:active { background: rgba(255,255,255,0.15); }
  .score-stepper-btn.minus:active { border-color: var(--accent); }
  .score-stepper-btn.plus:active { border-color: var(--green); }

  .score-num-input {
    background: var(--bg);
    border: 1.5px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    color: var(--accent2);
    font-size: 22px;
    font-weight: 800;
    text-align: center;
    width: 64px;
    height: 40px;
    outline: none;
    -webkit-appearance: none;
    transition: border-color 0.2s;
    padding: 0;
  }
  .score-num-input:focus { border-color: var(--accent2); }

  /* ── LEADERBOARD PANEL ── */
  #leaderboard-panel { display: none; flex-direction: column; height: 100%; }
  #leaderboard-panel.active { display: flex; }

  /* Sub-tab bar inside leaderboard */
  /* ── Leaderboard mode tabs (Raw / Per Player) ── */
  .lb-mode-bar {
    display: flex;
    gap: 0;
    background: rgba(255,255,255,0.03);
    border-bottom: 2px solid rgba(255,255,255,0.1);
    flex-shrink: 0;
    padding: 0 16px;
  }
  .lb-mode-btn {
    padding: 12px 20px;
    border: none;
    background: none;
    color: var(--text-muted);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
    transition: color 0.15s, border-color 0.15s;
    white-space: nowrap;
  }
  .lb-mode-btn.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .lb-mode-panel { display: none; }
  .lb-mode-panel.active { display: flex; flex-direction: column; flex: 1; overflow: hidden; }

  .lb-subtab-bar {
    display: flex;
    overflow-x: auto;
    gap: 2px;
    background: rgba(255,255,255,0.03);
    border-bottom: 1px solid rgba(255,255,255,0.07);
    padding: 0 16px;
    flex-shrink: 0;
    scrollbar-width: none;
  }
  .lb-subtab-bar::-webkit-scrollbar { display: none; }

  .lb-subtab-btn {
    flex-shrink: 0;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 600;
    padding: 10px 14px;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: color 0.2s, border-color 0.2s;
    white-space: nowrap;
  }
  .lb-subtab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }

  .lb-content {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 20px;
  }

  .lb-sub-panel { display: none; }
  .lb-sub-panel.active { display: block; }

  /* Leaderboard table */
  .lb-table {
    width: 100%;
    border-collapse: collapse;
    background: var(--surface);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  }

  .lb-table th {
    background: var(--surface2);
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    padding: 12px 16px;
    text-align: left;
  }
  .lb-table th:last-child, .lb-table td:last-child { text-align: right; }

  .lb-table td {
    padding: 14px 16px;
    font-size: 16px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .lb-table tr:last-child td { border-bottom: none; }

  .lb-table tr.top-1 td { background: rgba(255,215,0,0.08); }
  .lb-table tr.top-2 td { background: rgba(192,192,192,0.06); }
  .lb-table tr.top-3 td { background: rgba(205,127,50,0.06); }

  .lb-pos { font-weight: 800; font-size: 18px; width: 36px; display: inline-block; }
  .medal { font-size: 20px; }
  .lb-team { font-weight: 600; }
  .lb-score { font-weight: 800; color: var(--accent2); font-size: 18px; }

  /* Per-player table: fixed layout, all data columns equally spaced */
  .lb-table.pp-table { table-layout: fixed; }
  .lb-table.pp-table .col-players { width: 52px; text-align: center; }
  .lb-table.pp-table .col-stat    { width: 15%; text-align: center; }
  .lb-table.pp-table th.col-stat,
  .lb-table.pp-table td.col-stat  { text-align: center; }
  .lb-table.pp-table th.col-players,
  .lb-table.pp-table td.col-players { text-align: center; }

  .empty-msg {
    text-align: center;
    color: var(--text-muted);
    font-size: 15px;
    padding: 40px 20px;
  }

  /* ── MODAL ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .modal-overlay.show { display: flex; }

  .modal-box {
    background: var(--surface);
    border-radius: 18px;
    padding: 32px 28px;
    width: 100%;
    max-width: 400px;
    text-align: center;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.08);
  }

  .modal-icon { font-size: 52px; margin-bottom: 16px; }
  .modal-title { font-size: 22px; font-weight: 800; margin-bottom: 10px; }
  .modal-body { color: var(--text-muted); font-size: 15px; margin-bottom: 28px; line-height: 1.5; }
  .modal-actions { display: flex; gap: 12px; }

  .btn-cancel {
    flex: 1;
    background: rgba(255,255,255,0.07);
    border: 1.5px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    color: var(--text);
    font-size: 16px;
    font-weight: 700;
    padding: 14px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-cancel:active { background: rgba(255,255,255,0.14); }

  .btn-confirm-reset {
    flex: 1;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    color: #000;
    font-size: 16px;
    font-weight: 800;
    
    padding: 14px;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(240,192,64,0.35);
    transition: transform 0.1s;
  }
  .btn-confirm-reset:active { transform: scale(0.97); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }



  @media (min-width: 768px) {
    .score-row-name { font-size: 17px; }
  }
</style>
</head>

<script>
// ══════════════ STATE ══════════════
const STORAGE_KEY = 'pubQuizData_v3';

let state = {
  rounds: 3,
  teamCount: 8,
  teams: [],
  roundMaxPoints: [],
  activeTab: 0,
  activeLbTab: 'overall',
  activeLbMode: 'raw',
};

// ══════════════ HOLD-TO-REPEAT UTILITY ══════════════
function addHoldRepeat(btn, action) {
  let timer = null;
  let interval = null;
  function start() {
    action();
    timer = setTimeout(() => { interval = setInterval(action, 80); }, 400);
  }
  function stop() {
    clearTimeout(timer);
    clearInterval(interval);
    timer = null; interval = null;
  }
  btn.addEventListener('mousedown', start);
  btn.addEventListener('touchstart', (e) => { e.preventDefault(); start(); }, { passive: false });
  btn.addEventListener('mouseup', stop);
  btn.addEventListener('mouseleave', stop);
  btn.addEventListener('touchend', stop);
  btn.addEventListener('touchcancel', stop);
}

// ══════════════ SETUP ══════════════
let setupRounds = 3;
let setupTeams = 8;

function stepRounds(d) {
  setupRounds = Math.max(1, Math.min(10, setupRounds + d));
  document.getElementById('rounds-val').textContent = setupRounds;
}

function stepTeams(d) {
  setupTeams = Math.max(4, Math.min(30, setupTeams + d));
  document.getElementById('teams-val').textContent = setupTeams;
  renderTeamNameInputs();
}

function renderTeamNameInputs() {
  const grid = document.getElementById('team-names-grid');
  const existing = Array.from(grid.querySelectorAll('.team-name-input-wrap')).map(w => ({
    name: w.querySelector('input').value,
    players: parseInt(w.querySelector('.player-count-val')?.textContent) || 1
  }));
  grid.innerHTML = '';
  for (let i = 0; i < setupTeams; i++) {
    const prevName = existing[i]?.name || '';
    const prevPlayers = existing[i]?.players || 1;
    const wrap = document.createElement('div');
    wrap.className = 'team-name-input-wrap';
    wrap.innerHTML = `
      <span class="team-num-badge">${i+1}</span>
      <input type="text" placeholder="Team ${i+1}" maxlength="28" value="${prevName}">
      <div class="player-count-wrap">
        <span class="player-count-label">👤</span>
        <div class="player-count-stepper">
          <button data-idx="${i}" data-dir="-1">−</button>
          <span class="player-count-val">${prevPlayers}</span>
          <button data-idx="${i}" data-dir="1">+</button>
        </div>
      </div>
    `;
    grid.appendChild(wrap);
    wrap.querySelectorAll('.player-count-stepper button').forEach(btn => {
      btn.addEventListener('click', () => {
        const valEl = btn.closest('.player-count-stepper').querySelector('.player-count-val');
        const dir = parseInt(btn.dataset.dir);
        const cur = parseInt(valEl.textContent) || 1;
        valEl.textContent = Math.max(1, Math.min(50, cur + dir));
      });
    });
  }
}

function getTeamDataFromSetup() {
  return Array.from(document.querySelectorAll('#team-names-grid .team-name-input-wrap'))
    .map((wrap, i) => ({
      name: wrap.querySelector('input').value.trim() || `Team ${i+1}`,
      players: parseInt(wrap.querySelector('.player-count-val')?.textContent) || 1
    }));
}

function startQuiz() {
  const teamData = getTeamDataFromSetup();
  const teams = teamData.map(({ name, players }) => ({
    name,
    players,
    scores: Array(setupRounds).fill(null)
  }));
  const roundMaxPoints = Array(setupRounds).fill(null);
  state = { rounds: setupRounds, teamCount: setupTeams, teams, roundMaxPoints, activeTab: 0, activeLbTab: 'overall', activeLbMode: 'raw' };
  saveState();
  buildApp();
}

// ══════════════ PERSISTENCE ══════════════
function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      state = JSON.parse(raw);
      // Migration: add players to teams if missing
      if (state.teams) {
        state.teams = state.teams.map(t => ({ players: 1, ...t }));
      }
      // Migration: add roundMaxPoints if missing
      if (!state.roundMaxPoints) {
        state.roundMaxPoints = Array(state.rounds).fill(null);
      }
      // Migration: add activeLbMode if missing
      if (!state.activeLbMode) state.activeLbMode = 'raw';
      return true;
    }
  } catch(e) {}
  return false;
}

function buildApp() {

}

function buildTabs() {

// ══════════════ ROUND LIST ══════════════
function buildRoundList(panel, r) {
  panel.innerHTML = '';

  // Max points row
  const maxRow = document.createElement('div');
  maxRow.className = 'round-max-row';
  const maxVal = state.roundMaxPoints[r] !== null && state.roundMaxPoints[r] !== undefined ? state.roundMaxPoints[r] : '';
  maxRow.innerHTML = `
    <span class="round-max-label">Max points this round</span>
    <div class="score-row-controls" style="justify-content:center;">
      <input class="round-max-input score-num-input" type="text" inputmode="numeric" pattern="[0-9]*"
        placeholder="—" value="${maxVal}" data-maxround="${r}">
    </div>
  `;
  panel.appendChild(maxRow);
  const maxInp = maxRow.querySelector('.round-max-input');
  maxInp.addEventListener('blur', () => {
    const raw = maxInp.value.replace(/[^0-9]/g,'');
    const v = raw === '' ? null : Math.max(1, parseInt(raw)||1);
    maxInp.value = v === null ? '' : v;
    if (!state.roundMaxPoints) state.roundMaxPoints = Array(state.rounds).fill(null);
    state.roundMaxPoints[r] = v;
    saveState();
  });

  const list = document.createElement('div');
  list.className = 'score-list';

  // Header row
  const header = document.createElement('div');
  header.className = 'score-list-header';
  header.innerHTML = `<span>Team</span><span class="score-col-label">Score</span>`;
  list.appendChild(header);

  state.teams.forEach((team, i) => {
    const val = team.scores[r] !== null ? team.scores[r] : '';
    const row = document.createElement('div');
    row.className = 'score-row';
    row.innerHTML = `
      <div class="score-row-name" title="${esc(team.name)}">${esc(team.name)}</div>
      <div class="score-row-controls">
        <button class="score-stepper-btn minus" data-team="${i}" data-round="${r}">−</button>
        <input class="score-num-input"
          type="text"
          inputmode="numeric"
          pattern="[0-9]*"
          data-team="${i}" data-round="${r}"
          value="${val}" placeholder="—">
        <button class="score-stepper-btn plus" data-team="${i}" data-round="${r}">+</button>
      </div>
    `;
    list.appendChild(row);
  });

  panel.appendChild(list);

  // Events
  const allInputs = Array.from(panel.querySelectorAll('.score-num-input:not(.round-max-input)'));
  allInputs.forEach((inp, idx) => {
    inp.addEventListener('blur', () => {
      const t = +inp.dataset.team;
      const raw = inp.value.replace(/[^0-9]/g, '');
      const val = raw === '' ? null : Math.max(0, parseInt(raw) || 0);
      inp.value = val === null ? '' : val;
      state.teams[t].scores[r] = val;
      saveState();
    });
    inp.addEventListener('focus', () => {
      setTimeout(() => inp.select(), 10);
    });
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const t = +inp.dataset.team;
        const raw = inp.value.replace(/[^0-9]/g, '');
        const val = raw === '' ? null : Math.max(0, parseInt(raw) || 0);
        inp.value = val === null ? '' : val;
        state.teams[t].scores[r] = val;
        saveState();
        const next = allInputs[idx + 1];
        if (next) next.focus();
      }
    });
  });

  panel.querySelectorAll('.score-stepper-btn').forEach(btn => {
    const action = () => {
      const t = +btn.dataset.team;
      const isPlus = btn.classList.contains('plus');
      const curr = state.teams[t].scores[r] ?? 0;
      const next = Math.max(0, curr + (isPlus ? 1 : -1));
      state.teams[t].scores[r] = next;
      saveState();
      const inp = panel.querySelector(`.score-num-input[data-team="${t}"][data-round="${r}"]`);
      if (inp) inp.value = next;
    };
    addHoldRepeat(btn, action);
  });
}

// Per-player efficiency: (score / maxPoints) * 100 / players
function teamEfficiency(score, maxPts) {
  if (maxPts === null || maxPts === 0) return null;
  return (score / maxPts) * 100;
}

function playerEfficiency(score, maxPts, players) {
  if (maxPts === null || maxPts === 0 || players === 0) return null;
  return (score / maxPts) * 100 / players;
}

function ppPerPlayer(score, players) {
  if (players === 0) return null;
  return score / players;
}

function buildPpOverallHTML() {
  const totalMax = state.roundMaxPoints ? state.roundMaxPoints.reduce((s, v) => s + (v ?? 0), 0) : 0;
  const hasAnyMax = totalMax > 0;

  const sorted = [...state.teams]
    .map((t, i) => {
      const total = totalScore(t);
      const players = t.players || 1;
      const ppp = ppPerPlayer(total, players);
      const teamEff = hasAnyMax ? teamEfficiency(total, totalMax) : null;
      const playerEff = hasAnyMax ? playerEfficiency(total, totalMax, players) : null;
      return { ...t, orig: i, total, ppp, teamEff, playerEff };
    })
    .sort((a, b) => (b.playerEff ?? b.ppp ?? 0) - (a.playerEff ?? a.ppp ?? 0));

  let note = '';
  if (!hasAnyMax) {
    note = `<div style="padding:0 0 10px;font-size:12px;color:var(--text-muted)">ℹ️ Set max points per round to see efficiency columns. Showing pts/player ranking instead.</div>`;
  }

  let html = note + `<table class="lb-table pp-table"><thead><tr>
    <th style="width:44px">#</th>
    <th>Team</th>
    <th class="col-players">👤</th>
    <th class="col-stat">Total</th>
    ${hasAnyMax ? '<th class="col-stat">Team Efficiency</th>' : ''}
    <th class="col-stat">Pts / Player</th>
    ${hasAnyMax ? '<th class="col-stat">Player Efficiency</th>' : ''}
  </tr></thead><tbody>`;

  sorted.forEach((team, idx) => {
    const rank = idx + 1;
    const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : '';
    const pos = medal ? `<span class="medal">${medal}</span>` : `<span class="lb-pos" style="color:var(--text-muted)">${rank}</span>`;
    const posClass = rank === 1 ? 'top-1' : rank === 2 ? 'top-2' : rank === 3 ? 'top-3' : '';
    const ppp = team.ppp !== null ? team.ppp.toFixed(2) : '—';
    const tEff = team.teamEff !== null ? team.teamEff.toFixed(1) + '%' : '—';
    const pEff = team.playerEff !== null ? team.playerEff.toFixed(1) + '%' : '—';
    html += `<tr class="${posClass}">
      <td>${pos}</td>
      <td class="lb-team">${esc(team.name)}</td>
      <td class="col-players lb-score">${team.players||1}</td>
      <td class="lb-score col-stat">${team.total}</td>
      ${hasAnyMax ? `<td class="lb-score col-stat">${tEff}</td>` : ''}
      <td class="lb-score col-stat">${ppp}</td>
      ${hasAnyMax ? `<td class="lb-score col-stat">${pEff}</td>` : ''}
    </tr>`;
  });

  html += `</tbody></table>`;
  return html;
}

function buildPpRoundHTML(r) {
  const maxPts = state.roundMaxPoints?.[r] ?? null;
  const hasMax = maxPts !== null && maxPts > 0;

  const sorted = [...state.teams]
    .map((t, i) => {
      const score = t.scores[r];
      const players = t.players || 1;
      const ppp = score !== null ? ppPerPlayer(score, players) : null;
      const teamEff = (score !== null && hasMax) ? teamEfficiency(score, maxPts) : null;
      const playerEff = (score !== null && hasMax) ? playerEfficiency(score, maxPts, players) : null;
      return { ...t, orig: i, score, ppp, teamEff, playerEff };
    })
    .sort((a, b) => {
      const av = a.playerEff ?? a.ppp ?? -1;
      const bv = b.playerEff ?? b.ppp ?? -1;
      return bv - av;
    });

  const hasScores = sorted.some(t => t.score !== null);
  if (!hasScores) {
    return `<div class="empty-msg">No scores entered yet for Round ${r+1} 📝</div>`;
  }

  let note = '';
  if (!hasMax) {
    note = `<div style="padding:0 0 10px;font-size:12px;color:var(--text-muted)">ℹ️ Set max points for Round ${r+1} to see efficiency columns.</div>`;
  }

  let html = note + `<table class="lb-table pp-table"><thead><tr>
    <th style="width:44px">#</th>
    <th>Team</th>
    <th class="col-players">👤</th>
    <th class="col-stat">Score</th>
    ${hasMax ? '<th class="col-stat">Team Efficiency</th>' : ''}
    <th class="col-stat">Pts / Player</th>
    ${hasMax ? '<th class="col-stat">Player Efficiency</th>' : ''}
  </tr></thead><tbody>`;

  sorted.forEach((team, idx) => {
    if (team.score === null) return;
    const rank = idx + 1;
    const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : '';
    const pos = medal ? `<span class="medal">${medal}</span>` : `<span class="lb-pos" style="color:var(--text-muted)">${rank}</span>`;
    const posClass = rank === 1 ? 'top-1' : rank === 2 ? 'top-2' : rank === 3 ? 'top-3' : '';
    const ppp = team.ppp !== null ? team.ppp.toFixed(2) : '—';
    const tEff = team.teamEff !== null ? team.teamEff.toFixed(1) + '%' : '—';
    const pEff = team.playerEff !== null ? team.playerEff.toFixed(1) + '%' : '—';
    html += `<tr class="${posClass}">
      <td>${pos}</td>
      <td class="lb-team">${esc(team.name)}</td>
      <td class="col-players lb-score">${team.players||1}</td>
      <td class="lb-score col-stat">${team.score}</td>
      ${hasMax ? `<td class="lb-score col-stat">${tEff}</td>` : ''}
      <td class="lb-score col-stat">${ppp}</td>
      ${hasMax ? `<td class="lb-score col-stat">${pEff}</td>` : ''}
    </tr>`;
  });

  html += `</tbody></table>`;
  return html;
}

// Returns the 1-based ordinal rank for item at idx in a descending-sorted array.
// Items with the same score share the same rank; subsequent ranks are skipped.
function ordinalRank(sortedItems, idx, scoreGetter) {
  const myScore = scoreGetter(sortedItems[idx]);
  let firstIdx = idx;
  while (firstIdx > 0 && scoreGetter(sortedItems[firstIdx - 1]) === myScore) {
    firstIdx--;
  }
  return firstIdx + 1;
}

function buildOverallHTML() {
  const sorted = [...state.teams]
    .map((t, i) => ({ ...t, orig: i }))
    .sort((a, b) => totalScore(b) - totalScore(a));

  let html = `<table class="lb-table">
    <thead><tr>
      <th style="width:44px">#</th>
      <th>Team</th>`;

  for (let r = 0; r < state.rounds; r++) {
    html += `<th style="text-align:center">R${r+1}</th>`;
  }
  html += `<th>Total</th></tr></thead><tbody>`;

  sorted.forEach((team, idx) => {
    const rank = ordinalRank(sorted, idx, totalScore);
    const posClass = rank === 1 ? 'top-1' : rank === 2 ? 'top-2' : rank === 3 ? 'top-3' : '';
    const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : '';
    const pos = medal ? `<span class="medal">${medal}</span>` : `<span class="lb-pos" style="color:var(--text-muted)">${rank}</span>`;

    let roundCols = '';
    for (let r = 0; r < state.rounds; r++) {
      roundCols += `<td style="text-align:center;color:var(--text-muted)">${team.scores[r] !== null ? team.scores[r] : '—'}</td>`;
    }

    html += `<tr class="${posClass}">
      <td>${pos}</td>
      <td class="lb-team">${esc(team.name)}</td>
      ${roundCols}
      <td class="lb-score">${totalScore(team)}</td>
    </tr>`;
  });

  html += `</tbody></table>`;
  return html;
}

function buildRoundLbHTML(r) {
  const roundSorted = [...state.teams]
    .map((t, i) => ({ ...t, orig: i }))
    .sort((a, b) => (b.scores[r] ?? -1) - (a.scores[r] ?? -1));

  const hasScores = roundSorted.some(t => t.scores[r] !== null);

  if (!hasScores) {
    return `<div class="empty-msg">No scores entered yet for Round ${r+1} 📝</div>`;
  }

  let html = `<table class="lb-table">
    <thead><tr>
      <th style="width:44px">#</th>
      <th>Team</th>
      <th>Score</th>
    </tr></thead><tbody>`;

  roundSorted.forEach((team, idx) => {
    const rank = ordinalRank(roundSorted, idx, t => t.scores[r] ?? -1);
    const posClass = rank === 1 ? 'top-1' : rank === 2 ? 'top-2' : rank === 3 ? 'top-3' : '';
    const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : '';
    const pos = medal ? `<span class="medal">${medal}</span>` : `<span class="lb-pos" style="color:var(--text-muted)">${rank}</span>`;
    html += `<tr class="${posClass}">
      <td>${pos}</td>
      <td class="lb-team">${esc(team.name)}</td>
      <td class="lb-score">${team.scores[r] !== null ? team.scores[r] : '—'}</td>
    </tr>`;
  });

  html += `</tbody></table>`;
  return html;
}

function switchLbTab(tabKey, save = true) {

    btn.classList.toggle('active', btn.dataset.lbtab === tabKey);
  });

  document.querySelectorAll('.lb-sub-panel').forEach(p => p.classList.remove('active'));
  const target = tabKey === 'overall'
    ? document.getElementById('lb-sub-overall')
    : document.getElementById(`lb-sub-${tabKey}`);
  if (target) target.classList.add('active');
}

// ══════════════ TAB SWITCHING ══════════════
function totalScore(team) {
  return team.scores.reduce((s, v) => s + (v ?? 0), 0);
}

function switchTab(tabIndex) {
  state.activeTab = tabIndex;
  saveState();

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.toggle('active', +btn.dataset.tab === tabIndex);
  });

  document.querySelectorAll('.round-panel').forEach(p => p.classList.remove('active'));
  const lbPanel = document.getElementById('leaderboard-panel');
  lbPanel.classList.remove('active');

  if (tabIndex < state.rounds) {
    const panel = document.getElementById(`round-panel-${tabIndex}`);
    if (panel) panel.classList.add('active');
  } else {
    // Rebuild leaderboard fresh so scores are up to date
    buildLeaderboardPanel(lbPanel);
    lbPanel.classList.add('active');
  }
}

// ══════════════ RESET ══════════════
function confirmReset() {
  document.getElementById('reset-modal').classList.add('show');
}
function closeModal() {
  document.getElementById('reset-modal').classList.remove('show');
}
function doReset() {
  localStorage.removeItem(STORAGE_KEY);
  closeModal();
  location.reload();
}

// ══════════════ UTILS ══════════════
function esc(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ══════════════ INIT ══════════════
(function init() {
  renderTeamNameInputs();

  // Wire setup stepper buttons for hold-to-repeat
  document.querySelectorAll('.stepper button').forEach(btn => {
    const isPlus = btn.textContent.trim() === '+';
    const parent = btn.closest('.setup-field');
    const isRounds = parent && parent.querySelector('#rounds-val');
    btn.removeAttribute('onclick');
    addHoldRepeat(btn, () => {
      if (isRounds) stepRounds(isPlus ? 1 : -1);
      else stepTeams(isPlus ? 1 : -1);
    });
  });

  if (loadState() && state.teams && state.teams.length) {
    buildApp();
  } else {
    document.getElementById('setup-screen').style.display = 'flex';
  }
})();
</script>
